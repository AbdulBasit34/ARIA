[project]
name = "aria-research-agent"
version = "0.1.0"
description = "ARIA: Autonomous Research Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "arxiv",
    "fastapi",
    "httpx",
    "langgraph",
    "loguru",
    "omegaconf",
    "pydantic",
    "pytest",
    "python-dotenv",
    "qdrant-client",
    "rank-bm25",
    "sentence-transformers",
    "torch",
    "transformers",
    "uvicorn[standard]",
]

[project.optional-dependencies]
finetune = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "numpy",
    "pandas",
    "peft",
    "pyarrow",
    "torchao",
    "transformers",
    "trl",
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
